<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="style1.css">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="bg-animation">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="top-section">

<img src="https://cdn-icons-png.flaticon.com/512/8637/8637099.png" class="logo">

<h1>AI Career Path Finder</h1>

<p class="subtitle">Smart Study Assistant</p>

<p class="tagline">
Plan your future, learn smart, and achieve your dream career.
</p>

</div>

<div class="container">

<h2>Login</h2>

<p>Enter Your Details</p>

<div class="input-box">
<i class="fa fa-user"></i>
<input type="text" id="loginName" placeholder="Enter Name">
</div>

<div class="input-box">
<i class="fa fa-lock"></i>

<input type="password" id="loginPassword" placeholder="Enter Password">

<i class="fa fa-eye toggle" onclick="togglePassword()"></i>
</div>

<div class="input-box">
<i class="fa fa-key"></i>
<input type="text" id="loginOTP" placeholder="Enter OTP">
</div>

<button id="otpBtn" onclick="sendLoginOTP()">
<i class="fa-solid fa-paper-plane"></i>
Send OTP
</button>

<p id="timer"></p>

<button onclick="login()">
    <i class="fa-solid fa-right-to-bracket"></i>
    Login
</button>

<div class="bottom-option">
    <p>Don't have an account?
        <a href="index.html">Sign Up</a>
    </p>
</div>

</div>

<script>

emailjs.init({
publicKey:"Hl5dcu4ld5J7Fb0av"
});

let loginGeneratedOTP="";

function togglePassword(){

let pass=document.getElementById("loginPassword");

pass.type=pass.type==="password"?"text":"password";

}

function sendLoginOTP(){

let savedEmail=localStorage.getItem("email");

if(!savedEmail){

alert("Please Sign Up First");

return;

}

loginGeneratedOTP=Math.floor(1000+Math.random()*9000);

let params={

to_email:savedEmail,

otp:loginGeneratedOTP

};

emailjs.send("service_v28ijbi","template_ruz34ri",params)

.then(()=>{

alert("OTP Sent Successfully");

let sec=30;

let btn=document.getElementById("otpBtn");

btn.disabled=true;

let timer=setInterval(()=>{

document.getElementById("timer").innerHTML="Resend OTP in "+sec+"s";

sec--;

if(sec<0){

clearInterval(timer);

btn.disabled=false;

document.getElementById("timer").innerHTML="";

}

},1000);

})

.catch(()=>{

alert("OTP Sending Failed");

});

}

function login() {

    let savedName = localStorage.getItem("name");
    let savedPassword = localStorage.getItem("password");

    let name = document.getElementById("loginName").value.trim();
    let password = document.getElementById("loginPassword").value.trim();
    let otp = document.getElementById("loginOTP").value.trim();

    // Name Check
    if (name !== savedName) {
        alert("Wrong Name");
        return;
    }

    // Password Check
    if (password !== savedPassword) {
        alert("Wrong Password");
        return;
    }

    // OTP Send Hua Ya Nahi
    if (loginGeneratedOTP === "") {
        alert("Please click 'Send OTP' first.");
        return;
    }

    // OTP Empty Hai
    if (otp.length === 0) {
        alert("Please enter OTP.");
        document.getElementById("loginOTP").focus();
        return;
    }

    // OTP Sirf Numbers Hona Chahiye
    if (!/^\d{4}$/.test(otp)) {
        alert("Please enter a valid 4-digit OTP.");
        return;
    }

    // OTP Match
    if (otp != loginGeneratedOTP) {
        alert("Wrong OTP");
        return;
    }

    // Success
    localStorage.setItem("isLoggedIn", "true");
    alert("Login Successful");

    window.location.href = "start.html";
}

</script>

</body>
</html>
